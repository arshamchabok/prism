name = "prismapi"
main = "worker.js"
compatibility_date = "2026-05-17"

[build]
command = ""

[dev]
port = 8787

[[ratelimits]]
name = "PER_IP_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

[observability]
enabled = false
